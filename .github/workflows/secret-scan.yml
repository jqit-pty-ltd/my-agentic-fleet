# The repository's secret scan. It runs on every push, on every pull request, and once a week over the full history, and its one job is named gitleaks: that
# name is the required status check of the repository ruleset. The binary is pinned and its SHA-256 is checked (no licensed Action, no container pull).
# The scan always reads the whole history (fetch-depth 0), with the built-in rules from a config file written outside the tree, so a file in a pull request
# cannot weaken the scan; the finding's value is redacted. A scanner error fails the job and is never a pass.
name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: '23 19 * * 0'   # Sunday 19:23 UTC, off the hour
  workflow_dispatch:
# Least privilege, stated rather than inherited.
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned by commit sha, never a moving tag: an Action runs with the repository's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the Gitleaks binary and check its SHA-256
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP" || { echo "::error::RUNNER_TEMP unset - refusing to fall back to a shared path"; exit 1; }
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL --retry 3 --retry-delay 5 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Secret scan (Gitleaks, the full history)
        run: |
          set -euo pipefail
          # A suppression file or a config in the tree would let a change hide its own finding, so each is refused outright, and the scan reads its config
          # from a file outside the tree (the built-in rules) whatever the environment says.
          for f in .gitleaksignore .gitleaks.toml; do
            if [ -e "$f" ]; then
              echo "::error title=gitleaks-config::a $f in the tree changes what the scan finds; remove it"
              exit 1
            fi
          done
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.config.toml"
          "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/gitleaks.config.toml" --redact --no-banner --ignore-gitleaks-allow --exit-code 1 .
      - name: Remove the Gitleaks binary
        if: always()
        run: rm -f "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks.tgz" "$RUNNER_TEMP/gitleaks.config.toml"
